name: grind
on:
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: w2, cancel-in-progress: false}
jobs:
  w2:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: unzip bundle
        run: unzip -n "gha bundle.zip"
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q "pandas==3.0.2" numpy pyarrow scipy requests
      - name: cache tables
        uses: actions/cache@v4
        with:
          path: |
            bf_vantage_ALL_wide.parquet
            bf_vantage_ALL_mf.parquet
            bf_w2cols.parquet
            w2part_BTC.parquet
            w2part_ETH.parquet
            w2part_SOL.parquet
            w2part_XRP.parquet
          key: w2-v2-${{ github.run_number }}
          restore-keys: w2-v2-
      - name: build wide table if missing
        run: |
          if [ ! -f bf_vantage_ALL_wide.parquet ]; then
            mkdir -p data
            python fetch_arch.py BTCUSDT 2017 8
            python fetch_arch.py ETHUSDT 2017 8
            python fetch_arch.py SOLUSDT 2020 8
            python fetch_arch.py XRPUSDT 2018 5
            python b1t2_mf.py
            python b_join.py
          fi
      - name: raw data for extraction
        run: |
          if [ ! -f data/BTCUSDT_5m.csv ]; then
            mkdir -p data
            python fetch_arch.py BTCUSDT 2017 8
            python fetch_arch.py ETHUSDT 2017 8
            python fetch_arch.py SOLUSDT 2020 8
            python fetch_arch.py XRPUSDT 2018 5
          fi
      - name: w2 loop (progress pushed every slice)
        run: |
          git config user.name "grind-bot"; git config user.email "bot@none"
          for i in 1 2 3 4 5 6 7 8 9; do
            python w2.py --budget-min 26 || true
            git add w2_counts w2_state.json 2>/dev/null || true
            for p in w2_digest.csv w2_extinction.csv w2_summary.csv; do
              if [ -e "$p" ]; then git add "$p"; fi
            done
            git commit -m "w2 slice [skip ci]" || true
            git pull --rebase || true
            git push || true
            if grep -q '"phase": "b5"' w2_state.json 2>/dev/null; then break; fi
          done
