name: grind
on:
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: grind, cancel-in-progress: false}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: unzip bundle
        run: unzip -n "gha bundle.zip"
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q "pandas==3.0.2" numpy pyarrow scipy requests
      - name: cache wide table
        uses: actions/cache@v4
        with:
          path: |
            bf_vantage_ALL_wide.parquet
            bf_vantage_ALL_mf.parquet
          key: wide-v1
      - name: build wide table if missing
        run: |
          if [ ! -f bf_vantage_ALL_wide.parquet ]; then
            mkdir -p data
            python fetch_arch.py BTCUSDT 2017 8
            python fetch_arch.py ETHUSDT 2017 8
            python fetch_arch.py SOLUSDT 2020 8
            python fetch_arch.py XRPUSDT 2018 5
            python b1t2_mf.py
            python b_join.py
          fi
      - name: task
        run: python grind1.py --finalize 1 --b4 0
      - name: commit results
        run: |
          git config user.name "grind-bot"; git config user.email "bot@none"
          for p in w1_digest.csv w1_extinction.csv w1_summary.csv; do
            [ -e "$p" ] && git add "$p"
          done
          git commit -m "finalize [skip ci]" || echo "nothing to commit"
          git pull --rebase || true
          git push
